[package]
name = "store-bench"
version = "0.1.0"
description = "WP 0.5: SQLite (WAL) + Tantivy store benchmark at 500k messages"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
synth = { path = "../synth" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
zstd = "0.14"
