# Phase 0 tools. This is a standalone workspace so it stays separate from the
# product workspace that WP 1.0 creates at the repository root.
[workspace]
resolver = "2"
members = ["synth", "store-bench"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = 1
