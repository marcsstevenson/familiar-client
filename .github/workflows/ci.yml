name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install webview libraries (Linux, for familiar-gui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The engine, daemon and CLI must build on a machine with no display
  # libraries, so they fit a small container image. The slim Debian image has
  # no GTK, WebKit or X11. Only familiar-gui may need them.
  headless:
    name: Headless build (no display libraries)
    runs-on: ubuntu-latest
    container: rust:1-slim
    steps:
      - uses: actions/checkout@v5
      - name: Confirm no display libraries
        run: |
          if ls /usr/lib/*/libgtk-3* /usr/lib/*/libwebkit2gtk* /usr/lib/*/libX11* 2>/dev/null; then
            echo "display libraries found on the headless runner"; exit 1
          fi
      - name: Build and test without the GUI
        run: |
          cargo build --workspace --exclude familiar-gui --locked
          cargo test --workspace --exclude familiar-gui --locked
      - name: No GUI dependencies outside familiar-gui
        run: bash scripts/check-headless-deps.sh

  lint:
    name: Format and licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Licence headers
        run: bash scripts/check-licence-headers.sh
      - name: Colour contrast (WCAG 2.1 AA)
        run: node scripts/check-contrast.mjs
      - name: Type-check generated TypeScript bindings
        run: npx --yes -p typescript@5.9.3 tsc --strict --noEmit --target es2022 bindings/commands.ts
      - name: Type-check and build the desktop app's front end
        working-directory: crates/gui/ui
        run: |
          npm ci
          npm run build

  # The design doc's speed, memory and accessibility targets, on a synthetic
  # 500k-message store. Limits are in crates/gui/perf-budget.json.
  gui-perf:
    name: GUI performance and accessibility (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install webview libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb
      - name: Build the front end
        working-directory: crates/gui/ui
        run: |
          npm ci
          npm run build
      - name: Build
        run: cargo build --release --locked -p familiar-gui -p familiar-store -p familiar-search --examples --bins
      - name: Seed 500,000 messages and index them
        run: |
          target/release/examples/seed "$RUNNER_TEMP/bench/store" 500000
          target/release/examples/index "$RUNNER_TEMP/bench"
      - name: Bench
        run: bash scripts/bench-gui.sh "$RUNNER_TEMP/bench" bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-bench
          path: bench.json*

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
