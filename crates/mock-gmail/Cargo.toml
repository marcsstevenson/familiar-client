[package]
name = "familiar-mock-gmail"
description = "Local mock of the Gmail API and Google sign-in for offline provider tests (WP G.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mock-gmail"
path = "src/bin/mock-gmail.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
form_urlencoded = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints]
workspace = true
