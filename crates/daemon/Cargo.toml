[package]
name = "familiar-daemon"
description = "famd, the Familiar sync daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "famd"
path = "src/main.rs"

[dependencies]
familiar-auth.workspace = true
familiar-config.workspace = true
familiar-core.workspace = true
familiar-provider-graph.workspace = true
familiar-store.workspace = true
familiar-search.workspace = true
familiar-rules.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }

[dev-dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
familiar-mock-graph.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
