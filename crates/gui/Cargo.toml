[package]
name = "familiar-gui"
description = "Familiar desktop app (Tauri 2 + SolidJS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "familiar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ammonia = "4.2"
base64 = "0.22"
dirs = "6"
familiar-core.workspace = true
familiar-config.workspace = true
familiar-store.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
familiar-search.workspace = true
open = "5"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
webbrowser = "1"
tokio = { version = "1", features = ["net", "io-util"] }
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
ico = "0.6"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
