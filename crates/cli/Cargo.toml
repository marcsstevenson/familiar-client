[package]
name = "familiar-cli"
description = "fam, the Familiar command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fam"
path = "src/main.rs"

[dependencies]
familiar-core.workspace = true
familiar-store.workspace = true
familiar-search.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
familiar-mock-graph.workspace = true
familiar-provider-graph.workspace = true
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
