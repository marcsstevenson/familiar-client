[package]
name = "familiar-auth"
description = "Microsoft sign-in for Familiar: PKCE and device code, token storage and refresh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
dirs = "6"
getrandom = "0.2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
webbrowser = "1"

[dev-dependencies]
familiar-mock-graph.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
