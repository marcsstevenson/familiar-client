[package]
name = "auth-spike"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Throwaway WP 0.2 step B spike: Microsoft sign-in (PKCE and device code) and a few Graph calls"

[[bin]]
name = "auth-spike"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
webbrowser = "1"
